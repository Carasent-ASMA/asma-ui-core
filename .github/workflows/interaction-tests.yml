name: 'Interaction tests'

# Keyboard & focus contract suite (ASMA-8139) — WCAG 2.1.1, 2.1.2, 2.4.3, 2.4.7, 4.1.2, 4.1.3.
#
# Deliberately its own workflow rather than a step in lint-and-a11y.yml. That file's a11y job is
# named for axe, and docs/a11y-allowlist.md documents `pnpm test-storybook` as THE way to reproduce
# the axe baseline — folding a second suite into it would misattribute a red run and silently change
# what "test-storybook green" means for everyone who cites it.
#
# `pull_request` as well as `push`, so the check reports on the PR itself and can be made a required
# status check on master (same rationale as visual-regression.yml).
on:
    push:
    pull_request:

jobs:
    interaction:
        name: Keyboard & focus contract (vitest, real Chromium)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            # Same disk reclaim as the a11y job: node_modules plus the Playwright Chromium download
            # plus vitest's browser-mode dep cache have tipped a near-full runner into
            # "No space left on device" before. Best-effort, so a missing path on a future image
            # cannot fail the job.
            - name: Free disk space
              run: |
                  echo "Before:" && df -h /
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android "$AGENT_TOOLSDIRECTORY" /opt/ghc /usr/local/share/boost || true
                  docker image prune -af || true
                  echo "After:" && df -h /
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.14.0
            - uses: pnpm/action-setup@v4
              with:
                  version: latest
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps chromium
            # Mounts each interactive component in real Chromium and drives it with real key events
            # (Playwright/CDP), so focus traps, roving tabindex and Tab order are judged by the
            # browser rather than by a JS approximation of tab order. Contract defects found against
            # current component code are `it.skip`ped with a comment naming the SC and the file, and
            # tracked in docs/a11y-keyboard-contract.md — a skip here is an open escalation, not a
            # passing gate.
            - name: Run keyboard & focus contract tests
              run: pnpm test:interaction
