name: 'Visual Regression'

# `pull_request` makes the check report on the PR itself so it can be enforced as a required status
# check on master (a red VRT blocks the merge) — that half of the original rationale is unchanged.
#
# `push` is limited to master. Unrestricted it also fired on every branch, so a branch with an open
# pull request ran this suite twice for the same commit. Measured over the 30 days to 2026-11-13:
# 541 runs, 218 of them `pull_request` and 323 `push`, of which 241 were on non-master branches —
# and 218 of 321 distinct commits ran under both events. Two identical results, and this repository
# is 10% of the organisation's Actions bill.
#
# What this gives up: a push to a branch with no pull request open yet no longer runs this suite.
# That is roughly 23 runs a month, and `lint-and-a11y.yml` still runs on every push, so a bare
# branch is not left without signal.
on:
    push:
        branches:
            - master
    pull_request:

jobs:
    vrt:
        name: Run visual regression
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.14.0
            - uses: pnpm/action-setup@v4
              with:
                  version: latest
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            # Builds storybook-static on the host, captures/compares inside the pinned Playwright
            # container (same code path as local `pnpm vrt`). Docker is preinstalled on ubuntu-latest.
            - name: Run visual regression
              run: bash scripts/vrt.sh check
            - name: Upload diff report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: vrt-report
                  path: playwright-report/
                  retention-days: 14
